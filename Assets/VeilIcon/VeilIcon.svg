<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Veil app icon</title>
  <desc id="desc">A bright, quiet macOS utility icon showing Veil's matte notch capsule on a clean tile.</desc>
  <defs>
    <linearGradient id="tile" x1="276" y1="108" x2="748" y2="916" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FCFBF6"/>
      <stop offset="0.58" stop-color="#F2F0E9"/>
      <stop offset="1" stop-color="#E2DFD5"/>
    </linearGradient>
    <linearGradient id="capsule" x1="512" y1="248" x2="512" y2="444" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#161818"/>
      <stop offset="1" stop-color="#020303"/>
    </linearGradient>
    <filter id="capsuleShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.22"/>
    </filter>
    <clipPath id="tileClip">
      <rect x="96" y="96" width="832" height="832" rx="184"/>
    </clipPath>
  </defs>

  <rect width="1024" height="1024" fill="none"/>

  <rect x="96" y="96" width="832" height="832" rx="184" fill="url(#tile)"/>

  <g clip-path="url(#tileClip)">
    <path d="M256 518 H768" fill="none" stroke="#D8D5CB" stroke-width="2" stroke-linecap="round" opacity="0.42"/>
    <rect x="96" y="96" width="832" height="832" rx="184" fill="none" stroke="#FFFFFF" stroke-opacity="0.72" stroke-width="2"/>
    <rect x="96" y="96" width="832" height="832" rx="184" fill="none" stroke="#2C2D2A" stroke-opacity="0.10" stroke-width="2"/>
  </g>

  <g filter="url(#capsuleShadow)">
    <rect x="246" y="290" width="532" height="156" rx="78" fill="url(#capsule)"/>
    <rect x="247.5" y="291.5" width="529" height="153" rx="76.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.11" stroke-width="3"/>
    <rect x="326" y="360" width="112" height="18" rx="9" fill="#F8F6EF" opacity="0.88"/>
    <rect x="586" y="360" width="112" height="18" rx="9" fill="#C7921E" opacity="0.96"/>
    <rect x="474" y="348" width="76" height="42" rx="21" fill="#000000" opacity="0.72"/>
  </g>
</svg>
