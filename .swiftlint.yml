excluded:
  - .build
  - DerivedData
  - Assets
  - docs
  - Tools/render-veil-icon.swift

line_length:
  warning: 140
  error: 260
  ignores_comments: true
  ignores_urls: true

file_length:
  warning: 700
  error: 1200

type_body_length:
  warning: 500
  error: 900

function_body_length:
  warning: 80
  error: 240

cyclomatic_complexity:
  warning: 12
  error: 20

large_tuple:
  warning: 4
  error: 5

identifier_name:
  min_length:
    warning: 1
    error: 0
