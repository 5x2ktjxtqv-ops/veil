name: Feature Request
description: Suggest a focused Veil improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What should Veil help with?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What would you like to change?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Visual module
        - Local signal adapter
        - Compatibility
        - Packaging/install
        - Documentation
        - Advanced/private integration
    validations:
      required: true
  - type: textarea
    id: privacy
    attributes:
      label: Privacy / Safety Impact
      description: Does this read files, execute processes, send network traffic, request permissions, or persist settings?
    validations:
      required: true
